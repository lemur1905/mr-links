name: Update data and deploy

on:
  schedule:
    # Daily at 12:00 UTC. MR posts assorted links ~once/day; this picks them up.
    - cron: "0 12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Allow committing links.json back, and deploying to Pages via OIDC.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scraper deps
        run: pip install -r scripts/requirements.txt

      - name: Update links.json (incremental RSS scrape)
        run: python scripts/build_data.py

      - name: Commit links.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/links.json; then
            echo "No data changes."
          else
            git add public/links.json
            git commit -m "data: update links.json [skip ci]"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
